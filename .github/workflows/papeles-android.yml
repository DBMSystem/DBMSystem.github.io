# Papeles (document assistant app): M0 local CI, run on GitHub because the Android SDK is needed.
# Same gate as a contributor runs locally: the strings script tests and `./gradlew test lint`.
name: Papeles CI

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'papeles/**'
      - '.github/workflows/papeles-android.yml'
  pull_request:
    paths:
      - 'papeles/**'
      - '.github/workflows/papeles-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papeles-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Strings script tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Tests and lint
        run: ./gradlew test lint --no-daemon --stacktrace

      # Room exports the schema on compile; it must be committed so SchemaTest and future migrations use it.
      - name: Room schema committed
        if: success() || failure()
        run: |
          changed=$(git status --porcelain --untracked-files=all core/db/schemas)
          if [ -n "$changed" ]; then
            echo "The Room schema changed and is not committed:"
            echo "$changed"
            git diff core/db/schemas
            for f in $(git ls-files --others --modified core/db/schemas); do echo "===== $f"; cat "$f"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papeles-reports-${{ github.run_number }}
          path: papeles/**/build/reports/
          if-no-files-found: ignore

  # M2 "Listo cuando" needs PdfRenderer and ML Kit, so it runs on an emulator.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: papeles
          script: ./gradlew :core:text:connectedDebugAndroidTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papeles-device-reports-${{ github.run_number }}
          path: papeles/**/build/reports/androidTests/
          if-no-files-found: ignore
