# Calendario familiar APK. Every push that touches the calendar builds a debug APK (downloadable from the run);
# on main it is also published as the "calendario-apk" prerelease, so the latest one is always at the same link:
# https://github.com/DBMSystem/DBMSystem.github.io/releases/download/calendario-apk/CalendarioFamiliar.apk
name: Calendario APK

on:
  push:
    paths:
      - 'calendario/**'
      - 'calendario-android/**'
      - '.github/workflows/calendario-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendario-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendario-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calendario-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Tests
        run: node --test ../calendario/tests/*.test.mjs

      - name: Copy the web app and Capacitor sync
        run: npm run build:android

      - name: Version
        run: |
          echo "CAL_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "CAL_VERSION_CODE=$(node scripts/version-code.js)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: calendario-android/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name and check the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CalendarioFamiliar.apk
          unzip -l CalendarioFamiliar.apk | grep -q 'assets/public/index.html'
          unzip -l CalendarioFamiliar.apk | grep -q 'assets/public/native.js'
          ls -lh CalendarioFamiliar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalendarioFamiliar-${{ env.CAL_VERSION_NAME }}-${{ github.run_number }}
          path: calendario-android/CalendarioFamiliar.apk

      - name: Publish the latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete calendario-apk --yes --cleanup-tag || true
          gh release create calendario-apk CalendarioFamiliar.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Calendario familiar ${CAL_VERSION_NAME} (build ${{ github.run_number }})" \
            --notes "APK del calendario familiar. Se instala encima de la anterior y conserva los datos."
